# The relay behind Caddy, which gets and renews a TLS certificate for RELAY_HOST automatically.
# RELAY_HOST is this server's public IP, or a DNS name pointing at it. Open ports 80 and 443,
# copy .env.example to .env, then: docker compose up -d
services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      GRENADE_RELAY_TRUST_PROXY: "1"
      GRENADE_RELAY_REGISTRATION_KEY: ${GRENADE_RELAY_REGISTRATION_KEY:-}
      GRENADE_RELAY_ADMIN_KEY: ${GRENADE_RELAY_ADMIN_KEY:-}
      GRENADE_LOG: ${GRENADE_LOG:-info}
    volumes:
      - relay-data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_HOST: ${RELAY_HOST:?set RELAY_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  relay-data:
  caddy-data:
  caddy-config:
